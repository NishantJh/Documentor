name: windows-recorder-checks

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or ref containing the Windows recorder tests
        required: true
        default: feat/cloud-smoke-tests
        type: string

permissions:
  contents: read

jobs:
  recorder-checks:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Check out selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Run recorder checks in Windows PowerShell 5.1
        shell: powershell
        run: .\tests\windows\Invoke-RecorderChecks.ps1
      - name: Run uploader retry and recovery test in Windows PowerShell 5.1
        shell: powershell
        run: .\tests\windows\Test-UploaderRetry.ps1
      - name: Run recorder checks in PowerShell 7
        shell: pwsh
        run: .\tests\windows\Invoke-RecorderChecks.ps1
      - name: Run uploader retry and recovery test in PowerShell 7
        shell: pwsh
        run: .\tests\windows\Test-UploaderRetry.ps1
